<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eco Map local month fixture</title>
  </head>
  <body>
    <p id="fixture-status" role="status" style="position: absolute; top: 8px; left: 16px; right: 16px; z-index: 50; font-family: sans-serif;">
      테스트 화면 모듈을 불러오는 중입니다.
    </p>
    <noscript>이 테스트 화면은 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
    <script type="module">
      const status = document.getElementById('fixture-status');
      const reportFailure = (category) => {
        status.hidden = false;
        status.setAttribute('role', 'alert');
        status.textContent = `테스트 화면 ${category} 실패. 개발 서버와 파일 상태를 확인해 주세요.`;
      };
      import('./map-month-filter-browser.mjs').then(({ mountMapMonthFixture }) => {
        try {
          status.textContent = '테스트 화면을 그리는 중입니다.';
          mountMapMonthFixture(document.getElementById('root'), {
            onReady: () => { status.hidden = true; },
            onRenderError: () => reportFailure('렌더링'),
          });
        } catch {
          reportFailure('초기화');
        }
      }, () => reportFailure('모듈 불러오기'));
    </script>
  </body>
</html>
